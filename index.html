<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rak Novel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Literata:ital,wght@0,400;0,600;1,400&family=Young+Serif&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light dark;
  --bg:#F2F4F8; --surface:#FFFFFF; --ink:#1A2238; --muted:#5B6478; --line:#DCE1EB;
  --accent:#34478F; --accent-ink:#FFFFFF; --heart:#D6456B; --soft:#E7ECF4; --danger:#B3261E;
  --glow:#F2B24C;
  --display:'Young Serif', Georgia, 'Times New Roman', serif;
  --read-face:'Literata', Georgia, 'Times New Roman', serif;
  --sans:system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --read:1.15rem;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11141C; --surface:#1A1F2E; --ink:#E8ECF4; --muted:#9AA3B8; --line:#2A3145;
    --accent:#9DB2FF; --accent-ink:#0F1622; --heart:#F0708F; --soft:#232A3C; --danger:#F2857D;
  }
}
:root[data-theme="dark"]{
  --bg:#11141C; --surface:#1A1F2E; --ink:#E8ECF4; --muted:#9AA3B8; --line:#2A3145;
  --accent:#9DB2FF; --accent-ink:#0F1622; --heart:#F0708F; --soft:#232A3C; --danger:#F2857D;
}
/* reader themes (applied on body only while reading) */
body.rt-light{--bg:#FFFFFF;--surface:#F4F5F8;--ink:#1A2238;--muted:#5B6478;--line:#E3E6EE;--soft:#EDEFF5;--accent:#34478F;--accent-ink:#FFFFFF}
body.rt-sepia{--bg:#F3EAD3;--surface:#FBF5E6;--ink:#3B3124;--muted:#7B6B52;--line:#E2D5B5;--soft:#EADFC4;--accent:#7A4E1D;--accent-ink:#FFFFFF}
body.rt-night{--bg:#0E1117;--surface:#171B24;--ink:#D9DEE8;--muted:#8B93A7;--line:#262C3A;--soft:#1E2330;--accent:#9DB2FF;--accent-ink:#0F1622}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.5;min-height:100vh}
a{color:inherit}
button,input,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0}
.wrap{max-width:1040px;margin:0 auto;padding:0 16px}
.narrow{max-width:720px}
.muted{color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* header */
.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:12px;height:60px}
.brand{display:inline-flex;align-items:center;gap:8px;font-family:var(--display);font-size:1.3rem;text-decoration:none;white-space:nowrap}
.brand svg{color:var(--accent)}
#q{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px}
#q[hidden]{display:none}
#prog{position:absolute;left:0;bottom:-1px;height:3px;width:0;background:var(--glow)}
#prog[hidden]{display:none}

/* buttons */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;cursor:pointer;font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;white-space:nowrap}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.glow{background:var(--glow);border-color:var(--glow);color:#2A1A00;font-weight:600}
.btn.ghost{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.3);color:#fff}
.btn.ghost.like.on{color:#FF8FAE;border-color:#FF8FAE}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn.sm{padding:5px 10px;border-radius:8px}
.lnk{background:none;border:0;padding:0;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:.85rem}
.btn:focus-visible,.lnk:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible,.dot:focus-visible,#coverFile:focus-visible + .cpbox{outline:2px solid var(--glow);outline-offset:2px}

/* book cover: the spine is the recurring detail */
.cover{position:relative;aspect-ratio:2/3;border-radius:4px 10px 10px 4px;overflow:hidden;background:var(--soft);box-shadow:0 8px 18px rgba(20,30,60,.22)}
.cover::after{content:"";position:absolute;inset:0 auto 0 0;width:8px;background:linear-gradient(90deg,rgba(0,0,0,.34),rgba(255,255,255,.18) 55%,transparent)}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.cover.ph{background:linear-gradient(160deg,hsl(var(--h) 42% 34%),hsl(calc(var(--h) + 40) 48% 20%));display:flex;align-items:flex-end;padding:14px 12px 16px 20px;color:#fff;font-family:var(--display);font-size:1.05rem;line-height:1.2}

/* hero (home + detail): dark night sky, blurred cover behind */
.hero,.dhero{position:relative;overflow:hidden;color:#F4F1FF;background:linear-gradient(160deg,#0E1430,#26295A);border-radius:0 0 26px 26px}
.bgimg{position:absolute;inset:-40px;width:calc(100% + 80px);height:calc(100% + 80px);object-fit:cover;filter:blur(38px) saturate(1.25);opacity:.55}
.bgimg.ph{background:linear-gradient(160deg,hsl(var(--h) 42% 34%),hsl(calc(var(--h) + 40) 48% 20%))}
.hshade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(10,14,42,.78),rgba(10,14,42,.25))}
.hgrid{position:relative;display:grid;grid-template-columns:210px 1fr;gap:38px;align-items:center;padding:40px 16px 46px}
.hcover{display:block;text-decoration:none}
.hcover .cover{transform:perspective(900px) rotateY(-14deg) rotateZ(1deg);box-shadow:0 18px 40px rgba(0,0,0,.5),0 0 60px rgba(242,178,76,.22);transition:transform .3s}
.hcover:hover .cover{transform:perspective(900px) rotateY(-5deg) rotateZ(0deg)}
.htext h1{font-family:var(--display);font-weight:400;font-size:2.7rem;line-height:1.08}
.hby{margin:8px 0 0;color:#C9CCEB}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip{border:1px solid var(--line);border-radius:999px;padding:2px 11px;font-size:.82rem;color:var(--muted)}
.hero .chip,.dhero .chip{border-color:rgba(255,255,255,.3);color:#E6E8FF}
.hsyn{max-width:56ch;margin:14px 0 0;color:#DADCF5;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.hact{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}

/* home grid */
.sh{display:flex;align-items:baseline;justify-content:space-between;padding-top:30px}
.sh h2{margin:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:28px 18px;padding:18px 0 60px}
.card{text-decoration:none;display:block}
.card .cover{transition:transform .2s,box-shadow .2s}
.card:hover .cover{transform:translateY(-5px) rotate(-.6deg);box-shadow:0 16px 28px rgba(20,30,60,.3)}
.card h3{font-size:1rem;margin-top:12px;line-height:1.3;font-family:var(--display);font-weight:400}
.by{margin:2px 0 0;color:var(--muted);font-size:.9rem}
.stats{display:flex;gap:14px;margin:6px 0 0;color:var(--muted);font-size:.85rem}
.st{display:inline-flex;align-items:center;gap:5px}
.empty{padding:72px 0;max-width:460px}
.empty h1{font-family:var(--display);font-weight:400;font-size:1.8rem;margin-bottom:8px}
.empty p{color:var(--muted);margin:0 0 20px}
.pad{padding:32px 0}

/* detail */
.back{display:inline-flex;align-items:center;gap:4px;text-decoration:none;color:var(--muted);padding:16px 0 4px;font-size:.95rem}
.back.light{color:#C9CCEB}
.detail{position:relative;display:grid;grid-template-columns:220px 1fr;gap:30px;padding:14px 0 42px}
.title{font-family:var(--display);font-weight:400;font-size:2.3rem;line-height:1.12}
.dhero .by{color:#C9CCEB}
.synopsis{margin-top:14px}
.synopsis p{margin:0 0 .8em;max-width:62ch;color:#DADCF5}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
h2{font-size:1.15rem;margin:34px 0 12px}
.chaps{border-top:1px solid var(--line)}
.chap{display:grid;grid-template-columns:38px 1fr 20px;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line);text-decoration:none}
.cn{width:34px;height:34px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-weight:600;font-size:.9rem}
.chap:hover .cn{background:var(--accent);color:var(--accent-ink)}
.ct small{display:block;color:var(--muted);font-size:.82rem}
.go{color:var(--muted)}

/* comments */
.cform{display:grid;gap:10px;max-width:660px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.cform input,.cform textarea,.fields input,.fields textarea,.ched input,.ched textarea{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px}
.cform .btn{justify-self:start}
.clist{margin-top:14px;max-width:660px}
.cmt{display:grid;grid-template-columns:36px 1fr;gap:12px;padding:14px 0;border-top:1px solid var(--line)}
.av{width:36px;height:36px;border-radius:50%;background:hsl(var(--h) 45% 40%);color:#fff;display:grid;place-items:center;font-weight:600}
.cmt p{margin:4px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}
.chead{display:flex;align-items:baseline;gap:10px}
.chead time{color:var(--muted);font-size:.85rem;flex:1}

/* reader */
.reader{max-width:64ch;margin:0 auto;padding-bottom:64px}
.rbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:4px 12px}
.fs{display:flex;align-items:center;gap:6px;padding-top:12px}
.dot{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);cursor:pointer;padding:0}
.dot[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--bg) inset}
.d-light{background:#fff}.d-sepia{background:#F3EAD3}.d-night{background:#0E1117}
.ctitle{font-family:var(--display);font-weight:400;font-size:1.95rem;line-height:1.2;margin-top:22px}
.cnum{color:var(--muted);font-size:.9rem;margin:6px 0 28px}
.prose{font-family:var(--read-face);font-size:var(--read);line-height:1.85}
.prose p{margin:0 0 1.15em;overflow-wrap:anywhere}
.prose p.dc::first-letter{font-family:var(--display);float:left;font-size:3.4em;line-height:.85;padding:.08em .12em 0 0;color:var(--accent)}
.scene{border:0;text-align:center;margin:1.6em 0;color:var(--muted)}
.scene::before{content:"* * *";letter-spacing:.5em}
.pager{display:flex;justify-content:space-between;gap:12px;margin-top:40px}

/* editor */
.pt{font-family:var(--display);font-weight:400;font-size:1.8rem;margin:8px 0 22px}
.form{display:grid;grid-template-columns:200px 1fr;gap:24px}
.cpbox{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;color:var(--muted);cursor:pointer;border:2px dashed var(--line);border-radius:4px 10px 10px 4px;aspect-ratio:2/3;overflow:hidden;position:relative;font-size:.9rem;padding:10px}
.cpbox.has{border:0;padding:0}
.cpbox.has::after{content:"";position:absolute;inset:0 auto 0 0;width:8px;background:linear-gradient(90deg,rgba(0,0,0,.34),rgba(255,255,255,.18) 55%,transparent)}
.cpbox img{width:100%;height:100%;object-fit:cover;display:block}
.cprow{margin-top:8px;min-height:20px}
.fields{display:grid;gap:14px;align-content:start}
.fields label{display:grid;gap:6px;font-weight:500;font-size:.95rem}
.ched{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:14px;margin-bottom:12px;display:grid;gap:10px}
.chh{display:flex;justify-content:space-between;align-items:center}
.savebar{display:flex;flex-wrap:wrap;gap:10px;margin:22px 0 72px}

.notice{background:var(--soft);border-bottom:1px solid var(--line);padding:8px 16px;font-size:.9rem;text-align:center}
.notice[hidden]{display:none}
#toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:.92rem;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:20;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:700px){
  .hgrid,.detail,.form{grid-template-columns:1fr}
  .hgrid{gap:22px;padding:28px 16px 34px}
  .hcover .cover,.detail .cover,.form .coverpick{max-width:170px}
  .htext h1{font-size:2rem}
  .title{font-size:1.85rem}
}
@media (prefers-reduced-motion: reduce){*{transition:none !important}}

/* ---------- account / online mode ---------- */
.account{display:flex;align-items:center;gap:8px;flex-shrink:0}
.account .btn{white-space:nowrap}
.userpill{max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.authbox{max-width:430px;margin:48px auto;padding:24px;background:var(--surface);border:1px solid var(--line);border-radius:18px}
.authbox h1{margin-bottom:6px}.authbox p{margin-top:0}.authbox label{display:block;margin:14px 0 6px;font-weight:600}.authbox input{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.authrow{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}.online-note{font-size:.9rem;color:var(--muted);margin-top:12px}
.owner{font-size:.85rem;color:var(--muted);margin-top:4px}
</style>
</head>

Zain yang melihat mereka pun tersenyum dan segera memukul kepalanya sendiri. "Hei, bukan aku yang bilang tadi."
Hira pun memanggil kakaknya untuk melanjutkan perjalanan.
Setelah beristirahat, mereka pun melanjutkan perjalanan dan sampai di perbatasan Desa Masik dengan Desa Molis.
Di kaki gunung itu terdapat Desa Molis, yang bertugas menjaga Gunung Molis. Desa ini indah, dengan dua musim: musim panas dan musim salju.
Mereka pun diperiksa terlebih dahulu. Saat giliran mereka, Elsa terlihat sedikit panik dan menyembunyikan telinganya.
Setelah pemeriksaan selesai, mereka melanjutkan perjalanan. Zain pun bertanya.
"Elsa, kenapa kamu tadi menutupi kepalamu saat pemeriksaan?"
"Sebenarnya desa ini tidak menyukai elf. Mereka tidak mau ada ras selain manusia yang masuk ke Gunung Molis. Konon katanya dulu ras lain sering membuat masalah, padahal itu hanya mitos—mereka yang tidak mau ada sesuatu yang terungkap!"
Zain pun penasaran apa yang dimaksud Elsa, tapi sebelum sempat bertanya, Hira berteriak dari arah depan sambil berlari.
"Aghhh!!"
"Hira, kenapa?! Ada monster?" ucap Zain dan Elsa sambil berlari mendekat.
"Ini hewan apa, lucu banget!!"
Ternyata yang dimaksud Hira adalah seekor rubah salju. Mirip rubah biasa, tapi dengan mata biru muda dan bulu putih yang lembut. Jinak pula.
"Kirain apa, Hira. Jangan bikin panik begitu," ucap Zain lega.
Di sisi lain, Elsa merasa heran. Seharusnya rubah salju tidak turun ke dataran rendah Gunung Molis. Dalam hatinya, Elsa mulai memikirkan kemungkinan buruk.
Sambil berjalan ke puncak, mereka menikmati pemandangan indah desa-desa di bawah dari ketinggian.
"Wah, indah sekali!" ucap Hira sambil sedikit kedinginan.
"Nah, pas sekali. Coba gunakan sihirmu di sini, Hira. Sambil kita istirahat," ucap Elsa dengan semangat.
Menjadi guru sihir memang salah satu impian Elsa. Apalagi Hira memiliki sihir cahaya yang sangat jarang dimiliki orang.
"Memangnya sihir apa yang cocok sekarang, Ka Elsa?"
"Karena kamu sedang kedinginan, coba sihir pelindung diri."
Elsa mengajari Hira cara menggunakannya: siapkan tongkat sihir, tenangkan diri, lalu ucapkan 'Halo Barrier'.
"Halo Barrier!"
Ting.
Sebuah lingkaran cahaya muncul di atas kepala Hira. Tubuhnya sedikit bercahaya, dan hawa dingin tidak lagi terasa.
"Wah, berhasil, Ka Elsa!" ucapnya sambil tersenyum bahagia.
Dalam hati Elsa: Sudah kuduga, pasti dia bisa dengan satu kali coba. Padahal ini sihir tingkat menengah yang bisa memblokir serangan apa pun. Aku saja butuh satu minggu untuk berhasil. Melihat Hira berhasil jadi ikut senang juga.
"Ayo, Zain, sekarang giliranmu!"
Zain yang dari tadi duduk pun berdiri dan bertanya, "Emang aku bisa apa saja dengan sihir kegelapan ini?"
"Hmm, aku juga kurang tahu soal sihir kegelapan. Aku pernah punya buku tentang sihir kegelapan, tapi semuanya gagal waktu aku coba—mungkin karena sihirku bukan kegelapan. Nih, buku yang kumaksud. Baca aja dulu."
Elsa menyerahkan buku itu kepada Zain.
"Wah, terima kasih, Elsa. Ok, aku akan baca."
"Ka Elsa, aku lapar. Ayo makan!" ucap Hira yang sudah kelelahan dari tadi.
"Ayo kita makan dulu." Elsa pun mengeluarkan makanan yang sudah ia siapkan dari semalam.`;

const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const find=id=>state.novels.find(n=>n.id===id);
const paras=s=>String(s||'').split(/\n+/).map(t=>t.trim()).filter(Boolean).map(t=>/^(\*{3}|-{3})$/.test(t)?'<hr class="scene">':'<p>'+esc(t)+'</p>').join('');
const readMin=c=>Math.max(1,Math.round(String(c.body||'').split(/\s+/).filter(Boolean).length/200));
function ago(ts){
  const d=(Date.now()-ts)/1000;
  if(d<60) return 'baru saja';
  if(d<3600) return Math.floor(d/60)+' menit lalu';
  if(d<86400) return Math.floor(d/3600)+' jam lalu';
  if(d<2592000) return Math.floor(d/86400)+' hari lalu';
  return new Date(ts).toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'});
}
function hue(s){let h=0;for(const c of String(s||'x')) h=(h*31+c.charCodeAt(0))%360;return h;}

let storageOK=true;
function idbOpen(){return new Promise((res,rej)=>{const r=indexedDB.open('rak-novel',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);r.onblocked=()=>rej(new Error('blocked'));});}
async function localLoad(){try{const db=await idbOpen();return await new Promise((res,rej)=>{const t=db.transaction('kv').objectStore('kv').get('state');t.onsuccess=()=>res(t.result||null);t.onerror=()=>rej(t.error);});}catch(e){storageOK=false;return null;}}
async function localSave(){if(!storageOK)return;try{const db=await idbOpen();await new Promise((res,rej)=>{const tx=db.transaction('kv','readwrite');tx.objectStore('kv').put(JSON.parse(JSON.stringify(state)),'state');tx.oncomplete=res;tx.onerror=()=>rej(tx.error);tx.onabort=()=>rej(tx.error);});}catch(e){toast('Gagal menyimpan lokal.');}}
async function loadOnline(){
  const {data:{session},error:se}=await sb.auth.getSession();
  if(se) throw se;
  state.user=session?.user||null; state.online=!!state.user;
  if(!state.user) return;
  const {data,error}=await sb.from('novels').select('*').order('created_at',{ascending:false});
  if(error) throw error;
  state.novels=(data||[]).map(row=>({id:row.id,title:row.title,author:row.author,genre:row.genre||'',synopsis:row.synopsis||'',cover:row.cover||'',chapters:Array.isArray(row.chapters)?row.chapters:[],likes:row.likes||0,comments:Array.isArray(row.comments)?row.comments:[],createdAt:row.created_at||Date.now(),ownerId:row.owner_id}));
}
async function saveOnlineNovel(n){

  if(!user) throw new Error('LOGIN_REQUIRED');
  const row={id:n.id,owner_id:user.id,title:n.title,author:n.author,genre:n.genre||'',synopsis:n.synopsis||'',cover:n.cover||'',chapters:n.chapters||[],likes:n.likes||0,comments:n.comments||[],created_at:n.createdAt||Date.now()};

}

/* ---------- cover upload: crop to 2:3, compress ---------- */
function fileToCover(file){
  return new Promise((res,rej)=>{
    const fr=new FileReader();
    fr.onerror=()=>rej(fr.error);
    fr.onload=()=>{
      const img=new Image();
      img.onerror=()=>rej(new Error('bad image'));
      img.onload=()=>{
        const W=600,H=900,c=document.createElement('canvas');
        c.width=W;c.height=H;
        const s=Math.max(W/img.width,H/img.height),w=img.width*s,h=img.height*s;
        c.getContext('2d').drawImage(img,(W-w)/2,(H-h)/2,w,h);
        res(c.toDataURL('image/jpeg',0.82));
      };
      img.src=fr.result;
    };
    fr.readAsDataURL(file);
  });
}

    '<a class="back" href="'+(ex?'#/novel/'+ex.id:'#/')+'">'+ico.back+'Kembali</a>'+
    '<h1 class="pt">'+(ex?'Edit novel':'Novel baru')+'</h1>'+
    '<div class="form">'+
      '<div class="coverpick"><input type="file" id="coverFile" class="sr" accept="image/*"><label class="cpbox" id="cpBox" for="coverFile"></label>'+
      '<div class="cprow"><button class="lnk" data-act="rmcover" id="rmCover">Hapus sampul</button></div></div>'+
      '<div class="fields">'+
        '<label>Judul<input id="fTitle" maxlength="120" value="'+esc(draft.title)+'"></label>'+
        '<label>Nama penulis<input id="fAuthor" maxlength="60" value="'+esc(draft.author)+'"></label>'+
        '<label>Genre (pisahkan dengan koma)<input id="fGenre" maxlength="60" placeholder="Misalnya: Fantasi, Romansa" value="'+esc(draft.genre)+'"></label>'+
        '<label>Sinopsis<textarea id="fSyn" rows="6" maxlength="2000">'+esc(draft.synopsis)+'</textarea></label>'+
      '</div></div>'+
    '<h2>Bab</h2><div id="chapEd"></div>'+
    '<button class="btn" data-act="addch">Tambah bab</button>'+
    '<div class="savebar"><button class="btn primary" data-act="save">'+(ex?'Simpan perubahan':'Terbitkan novel')+'</button>'+
    (ex?'<button class="btn danger" data-act="delnovel">Hapus novel</button>':'')+'</div></div>';
  renderCoverPick(); renderChEd();
function renderCoverPick(){
  const b=$('#cpBox'); if(!b) return;
  if(draft.cover){ b.className='cpbox has'; b.innerHTML='<img src="'+draft.cover+'" alt="Pratinjau sampul">'; }
  else { b.className='cpbox'; b.innerHTML=ico.plus+'<span>Unggah sampul<br>(rasio 2:3)</span>'; }
  $('#rmCover').hidden=!draft.cover;
}
function renderChEd(){
  $('#chapEd').innerHTML=draft.chapters.map((c,i)=>
    '<div class="ched"><div class="chh"><b>Bab '+(i+1)+'</b>'+(draft.chapters.length>1?'<button class="lnk" data-act="rmch" data-i="'+i+'">Hapus bab</button>':'')+'</div>'+
    '<input data-ch="'+i+'" data-f="title" maxlength="120" placeholder="Judul bab" aria-label="Judul bab '+(i+1)+'" value="'+esc(c.title)+'">'+
    '<textarea data-ch="'+i+'" data-f="body" rows="10" placeholder="Tulis isi bab di sini. Pisahkan paragraf dengan baris baru. Ketik *** di baris sendiri untuk pemisah adegan." aria-label="Isi bab '+(i+1)+'">'+esc(c.body)+'</textarea></div>'
  ).join('');
}

function notFound(){
  setSearch(false);
  app.innerHTML='<div class="wrap"><div class="empty"><h1>Halaman tidak ditemukan</h1><p>Novel atau bab ini mungkin sudah dihapus.</p><a class="btn" href="#/">Kembali ke rak</a></div></div>';
}

/* ---------- actions ---------- */
function toggleLike(){
  const n=find(cur); if(!n) return;
  const i=state.liked.indexOf(n.id), on=i<0;
  if(on){state.liked.push(n.id);n.likes++;} else {state.liked.splice(i,1);n.likes=Math.max(0,n.likes-1);}
  const b=$('[data-act="like"]');
  if(b){b.classList.toggle('on',on);b.setAttribute('aria-pressed',on);b.innerHTML=likeInner(n,on);}
  save();
}
function postComment(){
  const n=find(cur); if(!n) return;
  const name=$('#cName').value.trim(), text=$('#cText').value.trim();
  if(!text){toast('Komentar tidak boleh kosong.');$('#cText').focus();return;}
  state.me=name;
  n.comments.push({id:uid(),name:name||'Anonim',text:text,ts:Date.now()});
  save(); renderComments(n); toast('Komentar terkirim.');
}
function delComment(id){
  const n=find(cur); if(!n) return;
  n.comments=n.comments.filter(m=>m.id!==id);
  save(); renderComments(n);
}
function applyFont(){document.documentElement.style.setProperty('--read',state.font+'rem');}
function fontStep(d){state.font=Math.min(1.6,Math.max(.95,+(state.font+d).toFixed(2)));applyFont();save();}
function setRT(v){
  state.rt=v; applyRT(); save();
  document.querySelectorAll('.dot').forEach(d=>d.setAttribute('aria-pressed',String(d.dataset.v===v)));
}
function addCh(){
  draft.chapters.push({title:'',body:''}); renderChEd();
  const t=document.querySelectorAll('.ched input'); if(t.length) t[t.length-1].focus();
}
async function saveDraft(){
  if(!draft.title.trim()){toast('Judul wajib diisi.');$('#fTitle').focus();return;}
  const n=Object.assign({},draft); const isNew=n._new; delete n._new;
  n.title=n.title.trim(); n.author=(n.author||'').trim()||'Anonim'; n.genre=(n.genre||'').trim();
  n.chapters=n.chapters.filter(c=>c.title.trim()||c.body.trim());
  if(!state.user){toast('Login dulu.');return;}
  n.ownerId=state.user.id;
  try{
    if(state.online) await saveOnlineNovel(n);
    const i=state.novels.findIndex(x=>x.id===n.id);
    if(i>=0) state.novels[i]=n; else state.novels.push(n);
    if(!state.online) await localSave();
    toast(isNew?'Novel diterbitkan.':'Perubahan disimpan.');
    location.hash='#/novel/'+n.id;
  }catch(e){console.error(e);toast('Gagal menyimpan online: '+(e.message||'cek Supabase/RLS'));}
}
}
function delNovel(b){
  if(b.dataset.sure){
    const id=draft.id;
    (async()=>{try{
      if(state.online) await deleteOnlineNovel(id); else await localSave();
      state.novels=state.novels.filter(x=>x.id!==id);
      state.liked=state.liked.filter(x=>x!==id);
      delete state.progress[id];
      toast('Novel dihapus.'); location.hash='#/';
    }catch(e){console.error(e);toast('Gagal menghapus novel.');}})();
  } else {
    b.dataset.sure='1'; b.textContent='Yakin hapus? Klik sekali lagi';
    setTimeout(()=>{if(b.isConnected){delete b.dataset.sure;b.textContent='Hapus novel';}},4000);
  }
}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]'); if(!b) return;
  const a=b.dataset.act;
  if(a==='login') authAction('login');
  else if(a==='signup') authAction('signup');
  else if(a==='logout') logout();
  else if(a==='like') toggleLike();
  else if(a==='comment') postComment();
  else if(a==='delcm') delComment(b.dataset.id);
  else if(a==='fup') fontStep(.05);
  else if(a==='fdown') fontStep(-.05);
  else if(a==='rt') setRT(b.dataset.v);
  else if(a==='addch') addCh();
  else if(a==='rmch'){draft.chapters.splice(+b.dataset.i,1);renderChEd();}
  else if(a==='rmcover'){e.preventDefault();draft.cover='';renderCoverPick();}
  else if(a==='save') saveDraft();
  else if(a==='delnovel') delNovel(b);
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='q'){q=t.value;renderGrid();return;}
  if(!draft) return;
  if(t.id==='fTitle') draft.title=t.value;
  else if(t.id==='fAuthor') draft.author=t.value;
  else if(t.id==='fGenre') draft.genre=t.value;
  else if(t.id==='fSyn') draft.synopsis=t.value;
  else if(t.dataset.ch!==undefined) draft.chapters[+t.dataset.ch][t.dataset.f]=t.value;
});
document.addEventListener('change',async e=>{
  if(e.target.id!=='coverFile'||!draft) return;
  const f=e.target.files&&e.target.files[0]; if(!f) return;
  if(!f.type.startsWith('image/')){toast('File harus berupa gambar.');return;}
  try{draft.cover=await fileToCover(f);renderCoverPick();}
  catch(err){toast('Gambar tidak bisa dibaca. Coba file lain.');}
});
window.addEventListener('scroll',onScroll,{passive:true});

/* ---------- router ---------- */
function route(){
  draft=null; inReader=false; applyRT(); $('#prog').hidden=true;
  const p=(location.hash.slice(1)||'/').split('/').filter(Boolean);
  if(!p.length) return home();
  if(p[0]==='novel') return detail(p[1]);
  if(p[0]==='baca') return read(p[1],parseInt(p[2],10)||0);
  if(p[0]==='tulis') return editor(p[1]);
  if(p[0]==='akun') return accountView();
  home();
}
window.addEventListener('hashchange',route);

(async function init(){
  const s=await load();
  if(s){
    state.novels=Array.isArray(s.novels)?s.novels:[];
    state.liked=Array.isArray(s.liked)?s.liked:[];
    state.me=s.me||''; state.font=s.font||1.15; state.rt=s.rt||'';
    state.progress=s.progress||{}; state.seeded=!!s.seeded;
  }
  if(!state.online && !state.seeded){ state.novels.push(seedNovel()); state.seeded=true; localSave(); }
  if(!state.online && !storageOK) $('#notice').hidden=false;
  accountHTML(); applyFont(); route();
  if(sb) sb.auth.onAuthStateChange(async (_event,session)=>{
    state.user=session?.user||null; state.online=!!state.user; accountHTML();
    if(state.user){try{await loadOnline();}catch(e){console.error(e);toast('Gagal memuat novel online.');}}
    else if(hasSupabase){state.novels=[];}
    route();
  });
})();
})();
</script>
</body>
</html>
