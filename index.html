<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rak Cerita</title>
<meta name="description" content="Rak Cerita — tempat berbagi novel, cerita bersambung, cerpen, dan voice note (VN).">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Literata:ital,wght@0,400;0,600;1,400&family=Young+Serif&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light dark;
  --bg:#F2F4F8; --surface:#FFFFFF; --ink:#1A2238; --muted:#5B6478; --line:#DCE1EB;
  --accent:#34478F; --accent-ink:#FFFFFF; --soft:#E7ECF4; --danger:#B3261E; --glow:#F2B24C;
  --k-novel:#34478F; --k-cerita:#7A4E9F; --k-cerpen:#B3651D; --k-vn:#1F7A5C;
  --display:'Young Serif', Georgia, 'Times New Roman', serif;
  --read-face:'Literata', Georgia, 'Times New Roman', serif;
  --sans:system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --read:1.15rem;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11141C; --surface:#1A1F2E; --ink:#E8ECF4; --muted:#9AA3B8; --line:#2A3145;
    --accent:#9DB2FF; --accent-ink:#0F1622; --soft:#232A3C; --danger:#F2857D;
  }
}
:root[data-theme="dark"]{
  --bg:#11141C; --surface:#1A1F2E; --ink:#E8ECF4; --muted:#9AA3B8; --line:#2A3145;
  --accent:#9DB2FF; --accent-ink:#0F1622; --soft:#232A3C; --danger:#F2857D;
}
/* tema baca (hanya saat membaca teks) */
body.rt-light{--bg:#FFFFFF;--surface:#F4F5F8;--ink:#1A2238;--muted:#5B6478;--line:#E3E6EE;--soft:#EDEFF5;--accent:#34478F;--accent-ink:#FFFFFF}
body.rt-sepia{--bg:#F3EAD3;--surface:#FBF5E6;--ink:#3B3124;--muted:#7B6B52;--line:#E2D5B5;--soft:#EADFC4;--accent:#7A4E1D;--accent-ink:#FFFFFF}
body.rt-night{--bg:#0E1117;--surface:#171B24;--ink:#D9DEE8;--muted:#8B93A7;--line:#262C3A;--soft:#1E2330;--accent:#9DB2FF;--accent-ink:#0F1622}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.5;min-height:100vh}
a{color:inherit}
button,input,textarea,select{font:inherit;color:inherit}
h1,h2,h3{margin:0}
.wrap{max-width:1040px;margin:0 auto;padding:0 16px}
.narrow{max-width:720px}
.muted{color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* header */
.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:12px;height:60px}
.brand{display:inline-flex;align-items:center;gap:8px;font-family:var(--display);font-size:1.3rem;text-decoration:none;white-space:nowrap}
.brand svg{color:var(--accent)}
#q{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px}
#q[hidden]{display:none}
.authArea{display:flex;align-items:center;gap:8px;flex-shrink:0}
.who{display:inline-flex;align-items:center;gap:6px;font-size:.88rem;color:var(--muted)}
.who .ava{width:26px;height:26px;border-radius:50%;object-fit:cover;flex-shrink:0}
.who b{color:var(--ink);font-weight:600}
.lnk{background:none;border:0;padding:0;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:.85rem}

/* buttons */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;cursor:pointer;font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;white-space:nowrap}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.glow{background:var(--glow);border-color:var(--glow);color:#2A1A00;font-weight:600}
.btn.ghost{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.3);color:#fff}
.btn.ghost.like.on{color:#FF8FAE;border-color:#FF8FAE}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn.sm{padding:5px 10px;border-radius:8px}
.btn.rec{border-color:var(--k-vn);color:var(--k-vn)}
.btn.rec.on{background:var(--k-vn);color:#fff;animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.75}}
.btn:focus-visible,.lnk:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,a:focus-visible,.dot:focus-visible{outline:2px solid var(--glow);outline-offset:2px}

/* cover */
.cover{position:relative;aspect-ratio:2/3;border-radius:4px 10px 10px 4px;overflow:hidden;background:var(--soft);box-shadow:0 8px 18px rgba(20,30,60,.22)}
.cover::after{content:"";position:absolute;inset:0 auto 0 0;width:8px;background:linear-gradient(90deg,rgba(0,0,0,.34),rgba(255,255,255,.18) 55%,transparent)}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.cover.ph{background:linear-gradient(160deg,hsl(var(--h) 42% 34%),hsl(calc(var(--h) + 40) 48% 20%));display:flex;align-items:flex-end;padding:14px 12px 16px 20px;color:#fff;font-family:var(--display);font-size:1.02rem;line-height:1.2}
.cover .badge{position:absolute;right:8px;top:8px;z-index:2;background:var(--k,#34478F);color:#fff;border-radius:999px;padding:3px 10px;font-size:.75rem;font-weight:600;box-shadow:0 2px 8px rgba(0,0,0,.3)}
.cover.wide{aspect-ratio:16/9;border-radius:12px}
.cover.wide .ph-inner{display:flex;align-items:center;justify-content:center;width:100%;height:100%;font-size:2.4rem}

/* hero */
.hero,.dhero{position:relative;overflow:hidden;color:#F4F1FF;background:linear-gradient(160deg,#0E1430,#26295A);border-radius:0 0 26px 26px}
.bgimg{position:absolute;inset:-40px;width:calc(100% + 80px);height:calc(100% + 80px);object-fit:cover;filter:blur(38px) saturate(1.25);opacity:.55}
.bgimg.ph{background:linear-gradient(160deg,hsl(var(--h) 42% 34%),hsl(calc(var(--h) + 40) 48% 20%))}
.hshade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(10,14,42,.78),rgba(10,14,42,.25))}
.hgrid{position:relative;display:grid;grid-template-columns:210px 1fr;gap:38px;align-items:center;padding:40px 16px 46px}
.hcover{display:block;text-decoration:none}
.hcover .cover{transform:perspective(900px) rotateY(-14deg) rotateZ(1deg);box-shadow:0 18px 40px rgba(0,0,0,.5),0 0 60px rgba(242,178,76,.22);transition:transform .3s}
.htext h1{font-family:var(--display);font-weight:400;font-size:2.5rem;line-height:1.08}
.hby{margin:8px 0 0;color:#C9CCEB}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip{border:1px solid var(--line);border-radius:999px;padding:2px 11px;font-size:.82rem;color:var(--muted)}
.hero .chip,.dhero .chip{border-color:rgba(255,255,255,.3);color:#E6E8FF}
.chip.k{background:var(--k,#34478F);border-color:var(--k);color:#fff;font-weight:600}
.hsyn{max-width:56ch;margin:14px 0 0;color:#DADCF5;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.hact{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}

/* filter jenis */
.filterbar{display:flex;flex-wrap:wrap;gap:8px;padding:18px 0 0}
.fbtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;cursor:pointer;font-size:.92rem;font-weight:500}
.fbtn[aria-pressed="true"]{background:var(--k,#34478F);border-color:var(--k);color:#fff;font-weight:600}

/* grid */
.sh{display:flex;align-items:baseline;justify-content:space-between;padding-top:26px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:28px 18px;padding:18px 0 60px}
.card{text-decoration:none;display:block;position:relative}
.card .cover{transition:transform .2s,box-shadow .2s}
.card:hover .cover{transform:translateY(-5px) rotate(-.6deg);box-shadow:0 16px 28px rgba(20,30,60,.3)}
.card h3{font-size:1rem;margin-top:12px;line-height:1.3;font-family:var(--display);font-weight:400}
.by{margin:2px 0 0;color:var(--muted);font-size:.9rem}
.stats{display:flex;gap:14px;margin:6px 0 0;color:var(--muted);font-size:.85rem}
.st{display:inline-flex;align-items:center;gap:5px}
.empty{padding:72px 0;max-width:460px}
.empty h1{font-family:var(--display);font-weight:400;font-size:1.8rem;margin-bottom:8px}
.empty p{color:var(--muted);margin:0 0 20px}
.pad{padding:32px 0}

/* detail */
.back{display:inline-flex;align-items:center;gap:4px;text-decoration:none;color:var(--muted);padding:16px 0 4px;font-size:.95rem}
.back.light{color:#C9CCEB}
.detail{position:relative;display:grid;grid-template-columns:220px 1fr;gap:30px;padding:14px 0 42px}
.title{font-family:var(--display);font-weight:400;font-size:2.3rem;line-height:1.12}
.synopsis{margin-top:14px}
.synopsis p{margin:0 0 .8em;max-width:62ch;color:#DADCF5}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
h2{font-size:1.15rem;margin:34px 0 12px}
.chaps{border-top:1px solid var(--line)}
.chap{display:grid;grid-template-columns:38px 1fr 20px;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line);text-decoration:none}
.cn{width:34px;height:34px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-weight:600;font-size:.9rem}
.chap:hover .cn{background:var(--k,var(--accent));color:#fff}
.ct small{display:block;color:var(--muted);font-size:.82rem}
.go{color:var(--muted)}

/* vn player */
.vnplayer{margin-top:18px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:10px}
.vnplayer audio{width:100%}

/* comments */
.cform{display:grid;gap:10px;max-width:660px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.cform textarea{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px}
.cform .btn{justify-self:start}
.clist{margin-top:14px;max-width:660px}
.cmt{display:grid;grid-template-columns:36px 1fr;gap:12px;padding:14px 0;border-top:1px solid var(--line)}
.av{width:36px;height:36px;border-radius:50%;background:hsl(var(--h) 45% 40%);color:#fff;display:grid;place-items:center;font-weight:600}
.cmt p{margin:4px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}
.chead{display:flex;align-items:baseline;gap:10px}
.chead time{color:var(--muted);font-size:.85rem;flex:1}

/* reader */
.reader{max-width:64ch;margin:0 auto;padding-bottom:64px}
.rbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:4px 12px}
.fs{display:flex;align-items:center;gap:6px;padding-top:12px}
.dot{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);cursor:pointer;padding:0}
.dot[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--bg) inset}
.d-light{background:#fff}.d-sepia{background:#F3EAD3}.d-night{background:#0E1117}
.ctitle{font-family:var(--display);font-weight:400;font-size:1.95rem;line-height:1.2;margin-top:22px}
.cnum{color:var(--muted);font-size:.9rem;margin:6px 0 28px}
.prose{font-family:var(--read-face);font-size:var(--read);line-height:1.85}
.prose p{margin:0 0 1.15em;overflow-wrap:anywhere}
.prose p.dc::first-letter{font-family:var(--display);float:left;font-size:3.4em;line-height:.85;padding:.08em .12em 0 0;color:var(--accent)}
.scene{border:0;text-align:center;margin:1.6em 0;color:var(--muted)}
.scene::before{content:"* * *";letter-spacing:.5em}
.pager{display:flex;justify-content:space-between;gap:12px;margin-top:40px}

/* editor */
.pt{font-family:var(--display);font-weight:400;font-size:1.8rem;margin:8px 0 22px}
.form{display:grid;grid-template-columns:200px 1fr;gap:24px}
.cpbox{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;color:var(--muted);cursor:pointer;border:2px dashed var(--line);border-radius:4px 10px 10px 4px;aspect-ratio:2/3;overflow:hidden;position:relative;font-size:.9rem;padding:10px}
.cpbox.has{border:0;padding:0}
.cpbox img{width:100%;height:100%;object-fit:cover;display:block}
.cprow{margin-top:8px;min-height:20px}
.fields{display:grid;gap:14px;align-content:start}
.fields label{display:grid;gap:6px;font-weight:500;font-size:.95rem}
.fields input,.fields textarea,.fields select,.ched input,.ched textarea{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px}
.kindpick{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.kopt{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 8px;cursor:pointer;text-align:center;font-size:.9rem}
.kopt b{display:block;font-size:1rem}
.kopt small{color:var(--muted)}
.kopt[aria-pressed="true"]{border-color:var(--kc);box-shadow:0 0 0 2px var(--kc) inset;font-weight:600}
.audiobox{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:14px;display:grid;gap:10px}
.audiobox audio{width:100%}
.ched{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:14px;margin-bottom:12px;display:grid;gap:10px}
.chh{display:flex;justify-content:space-between;align-items:center}
.savebar{display:flex;flex-wrap:wrap;gap:10px;margin:22px 0 72px}
.hint{font-size:.85rem;color:var(--muted);margin:2px 0 0}

.notice{background:var(--soft);border-bottom:1px solid var(--line);padding:8px 16px;font-size:.9rem;text-align:center}
.notice[hidden]{display:none}
#toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:.92rem;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:20;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:700px){
  .hgrid,.detail,.form{grid-template-columns:1fr}
  .hgrid{gap:22px;padding:28px 16px 34px}
  .hcover .cover,.detail .cover,.form .coverpick{max-width:170px}
  .htext h1{font-size:1.9rem}
  .title{font-size:1.75rem}
  .kindpick{grid-template-columns:repeat(2,1fr)}
}
@media (prefers-reduced-motion: reduce){*{transition:none !important;animation:none !important}}
</style>
</head>
<body>
<header class="top">
  <div class="wrap bar">
    <a class="brand" href="#/"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>Rak Cerita</a>
    <input id="q" type="search" placeholder="Cari judul atau penulis" aria-label="Cari cerita">
    <div class="authArea" id="authArea"></div>
  </div>
</header>
<div class="notice" id="notice" hidden>Tidak bisa terhubung ke server. Periksa koneksi internet kamu, lalu muat ulang halaman.</div>
<main id="app"><div class="wrap pad muted">Memuat…</div></main>
<div id="toast" role="status" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function(){
'use strict';
const $=(s,el)=>(el||document).querySelector(s);
const app=$('#app');

/* ============================================================
   KONFIGURASI — GANTI 3 BARIS INI SETELAH DEPLOY KE GITHUB PAGES
   SITE_URL : URL publik web kamu (harus terdaftar di Supabase
              → Authentication → URL Configuration → Redirect URLs)
   ============================================================ */
const SUPABASE_URL='https://ijfcmpykouafpdgvzsrf.supabase.co';
const SUPABASE_ANON_KEY='sb_publishable_ANuC1pRJDmlTJpZwTllm-A_ZiwgRwRo';
const SITE_URL=(location.hostname==='localhost'||location.hostname==='127.0.0.1')
  ? location.origin+location.pathname      // di lokal: pakai alamat lokal
  : (location.origin+location.pathname);   // di GitHub Pages: otomatis URL publik

const sb=window.supabase?window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY,{
  auth:{ flowType:'pkce', detectSessionInUrl:true, persistSession:true, autoRefreshToken:true, storageKey:'rak-cerita-auth' }
}):null;

/* ---------- jenis konten ---------- */
const KINDS={
  novel :{label:'Novel',            emoji:'📖', color:'#34478F'},
  cerita:{label:'Cerita Bersambung',emoji:'🧵', color:'#7A4E9F'},
  cerpen:{label:'Cerpen',           emoji:'✍️', color:'#B3651D'},
  vn    :{label:'Voice Note',       emoji:'🎧', color:'#1F7A5C'}
};
const KIND_LIST=Object.keys(KINDS);

const state={font:1.15,rt:'',progress:{},kind:''};
let session=null, seq=0, allStories=[], curStory=null;
let cur=null, draft=null, q='', inReader=false, recorder=null, recChunks=[], recTimer=null;

/* ---------- helpers ---------- */
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function displayName(u){
  if(!u) return 'Anonim';
  const m=u.user_metadata||{};
  return m.full_name||m.name||(u.email?u.email.split('@')[0]:'Anonim');
}
const paras=s=>String(s||'').split(/\n+/).map(t=>t.trim()).filter(Boolean).map(t=>/^(\*{3}|-{3})$/.test(t)?'<hr class="scene">':'<p>'+esc(t)+'</p>').join('');
const readMin=c=>Math.max(1,Math.round(String(c.body||'').split(/\s+/).filter(Boolean).length/200));
function ago(ts){
  const d=(Date.now()-new Date(ts).getTime())/1000;
  if(d<60) return 'baru saja';
  if(d<3600) return Math.floor(d/60)+' menit lalu';
  if(d<86400) return Math.floor(d/3600)+' jam lalu';
  if(d<2592000) return Math.floor(d/86400)+' hari lalu';
  return new Date(ts).toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'});
}
function hue(s){let h=0;for(const c of String(s||'x')) h=(h*31+c.charCodeAt(0))%360;return h;}
let tt;
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),2800);}

/* Anti-hang: semua request ke Supabase dibatasi waktu. */
const NET_TIMEOUT=15000;
function net(p){
  return Promise.race([
    Promise.resolve(p),
    new Promise((_,rej)=>setTimeout(()=>rej(new Error('Koneksi lambat atau terputus. Periksa internet kamu.')),NET_TIMEOUT))
  ]);
}
function netError(msg){
  setSearch(false);
  app.innerHTML='<div class="wrap"><div class="empty"><h1>Gagal terhubung ke server</h1><p class="muted">'+esc(msg||'Periksa koneksi internet kamu, lalu coba lagi.')+'</p><button class="btn primary" data-act="retry">Coba lagi</button></div></div>';
}
/* btoa aman untuk unicode (sampul SVG dsb.) */
function b64(s){
  const b=new TextEncoder().encode(s);
  let bin='';b.forEach(v=>bin+=String.fromCharCode(v));
  return btoa(bin);
}

const ico={
  heart:on=>'<svg width="18" height="18" viewBox="0 0 24 24" fill="'+(on?'currentColor':'none')+'" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1.1L12 21.3l7.8-7.8 1-1.1a5.5 5.5 0 0 0 0-7.8z"/></svg>',
  chat:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 11.5a8.4 8.4 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.4 8.4 0 0 1-3.8-.9L3 21l1.9-5.7a8.4 8.4 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.4 8.4 0 0 1 3.8-.9h.5a8.5 8.5 0 0 1 8 8v.5z"/></svg>',
  share:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"/></svg>',

/* ---------- sampul ---------- */
function fileToCover(file){
  return new Promise((res,rej)=>{
    const fr=new FileReader();
    fr.onerror=()=>rej(fr.error);
    fr.onload=()=>{
      const img=new Image();
      img.onerror=()=>rej(new Error('bad image'));
      img.onload=()=>{
        const W=600,H=900,c=document.createElement('canvas');
        c.width=W;c.height=H;
        const s=Math.max(W/img.width,H/img.height),w=img.width*s,h=img.height*s;
        c.getContext('2d').drawImage(img,(W-w)/2,(H-h)/2,w,h);
        res(c.toDataURL('image/jpeg',0.82));
      };
      img.src=fr.result;
    };
    fr.readAsDataURL(file);
  });
}

      .select('id,kind,title,author,owner_id,owner_name,genre,synopsis,cover,audio_url,like_count,view_count,created_at,story_chapters(count),story_comments(count)')

  const single=draft.kind==='cerpen';
  $('#chapEd').innerHTML=draft.chapters.map((c,i)=>
    '<div class="ched"><div class="chh"><b>'+(single?'Isi':('Bab '+(i+1)))+'</b>'+((draft.chapters.length>1)?'<button class="lnk" data-act="rmch" data-i="'+i+'">Hapus bab</button>':'')+'</div>'+
    (single?'':'<input data-ch="'+i+'" data-f="title" maxlength="160" placeholder="Judul bab" aria-label="Judul bab '+(i+1)+'" value="'+esc(c.title)+'">')+
    '<textarea data-ch="'+i+'" data-f="body" rows="10" placeholder="Tulis isi di sini. Pisahkan paragraf dengan baris baru. Ketik *** di baris sendiri untuk pemisah adegan." aria-label="Isi '+(i+1)+'">'+esc(c.body)+'</textarea></div>'
  ).join('');
}
function setKind(k){
  draft.kind=k; renderEditor();
}
function renderRecState(msg){
  const el=$('#recState'); if(el) el.textContent=msg;
}

/* ---------- perekam audio VN ---------- */
async function toggleRec(){
  const b=$('#recBtn');
  if(recorder){
    recorder.stop(); return;
  }
  if(!navigator.mediaDevices||!window.MediaRecorder){
    toast('Perekam tidak didukung peramban ini. Gunakan unggah audio.');
    return;
  }
  try{
    const stream=await navigator.mediaDevices.getUserMedia({audio:true});
    const recMime=MediaRecorder.isTypeSupported('audio/webm')?'audio/webm':'';
    recorder=new MediaRecorder(stream, recMime?{mimeType:recMime}:undefined);
    recChunks=[];
    recorder.ondataavailable=e=>{ if(e.data.size) recChunks.push(e.data); };
    const mime=recorder.mimeType||'audio/webm';
    recorder.onstop=()=>{
      stream.getTracks().forEach(t=>t.stop());
      clearInterval(recTimer);
      recorder=null;
      if(b){b.classList.remove('on');b.textContent='🎙 Rekam VN';}
      const blob=new Blob(recChunks,{type:mime});
      const seconds=Math.round(blob.size/16000);
      draft._audioBlob=blob;
      draft.audio_url=URL.createObjectURL(blob);
      const p=$('#audioPrev'); if(p){p.src=draft.audio_url;p.hidden=false;}
      renderRecState('Rekaman siap ('+seconds+'s) ✓ akan diunggah saat simpan. Tekan rekam lagi untuk mengganti.');
    };
    recorder.start();
    b.classList.add('on'); b.textContent='⏹ Selesai merekam';
    renderRecState('Merekam… tekan lagi untuk berhenti.');
  }catch(e){
    recorder=null;
    toast('Tidak bisa mengakses mikrofon: '+e.message);
  }
}
async function uploadAudio(novelId){
  if(!draft._audioBlob) return null;
  const ext=(draft._audioBlob.type.split('/')[1]||'webm').split(';')[0];
  const path=novelId+'-'+Date.now()+'.'+ext;
  const { error }=await sb.storage.from('vn-audio').upload(path,draft._audioBlob,{contentType:draft._audioBlob.type,upsert:true});
  if(error) throw error;
  const { data }=sb.storage.from('vn-audio').getPublicUrl(path);
  return data.publicUrl;
}

/* ---------- notFound ---------- */
function notFound(){
  setSearch(false);
  app.innerHTML='<div class="wrap"><div class="empty"><h1>Halaman tidak ditemukan</h1><p>Cerita atau bagian ini mungkin sudah dihapus.</p><a class="btn" href="#/">Kembali ke rak</a></div></div>';
}

/* ---------- actions ---------- */
async function toggleLike(){
  if(!curStory) return;
  if(!session){ toast('Masuk dengan Google dulu untuk menyukai cerita ini.'); return; }
  const wasLiked=curStory.liked;
  curStory.liked=!wasLiked; curStory.like_count=Math.max(0,(curStory.like_count||0)+(wasLiked?-1:1));
  const b=$('[data-act="like"]');
  if(b){b.classList.toggle('on',curStory.liked);b.setAttribute('aria-pressed',curStory.liked);b.innerHTML=likeInner(curStory,curStory.liked);}
  const { error }=wasLiked
    ? await sb.from('story_likes').delete().eq('story_id',curStory.id).eq('user_id',session.user.id)
    : await sb.from('story_likes').insert({story_id:curStory.id,user_id:session.user.id});
  if(error){
    curStory.liked=wasLiked; curStory.like_count=Math.max(0,(curStory.like_count||0)+(wasLiked?1:-1));
    if(b){b.classList.toggle('on',curStory.liked);b.setAttribute('aria-pressed',curStory.liked);b.innerHTML=likeInner(curStory,curStory.liked);}
    toast('Gagal menyimpan suka: '+(error.message||'coba lagi'));
  }
}
async function postComment(){
  if(!curStory) return;
  if(!session){ toast('Masuk dengan Google dulu untuk berkomentar.'); return; }
  const text=$('#cText').value.trim();
  if(!text){toast('Komentar tidak boleh kosong.');$('#cText').focus();return;}
  const name=displayName(session.user);
  const { data, error }=await sb.from('story_comments').insert({story_id:curStory.id,user_id:session.user.id,name,text}).select().single();
  if(error){ toast('Gagal mengirim komentar: '+error.message); return; }
  curStory.comments.push(data);
  renderComments(curStory);
  toast('Komentar terkirim.');
}
async function delComment(id){
  if(!curStory) return;
  const { error }=await sb.from('story_comments').delete().eq('id',id);
  if(error){ toast('Gagal menghapus komentar.'); return; }
  curStory.comments=curStory.comments.filter(m=>m.id!==id);
  renderComments(curStory);
}
function applyFont(){document.documentElement.style.setProperty('--read',state.font+'rem');}
function fontStep(d){state.font=Math.min(1.6,Math.max(.95,+(state.font+d).toFixed(2)));applyFont();saveLocalPrefs();}
function setRT(v){
  state.rt=v; applyRT(); saveLocalPrefs();
  document.querySelectorAll('.dot').forEach(d=>d.setAttribute('aria-pressed',String(d.dataset.v===v)));
}
function addCh(){
  draft.chapters.push({title:'',body:''}); renderChEd();
  const t=document.querySelectorAll('.ched input'); if(t.length) t[t.length-1].focus();
}
async function saveDraft(){
  if(!session){ toast('Masuk dengan Google dulu untuk menerbitkan.'); return; }
  if(!draft.title.trim()){toast('Judul wajib diisi.');$('#fTitle').focus();return;}
  if(draft.kind==='vn'&&!draft.audio_url){toast('Rekam atau unggah audio VN dulu ya.');return;}
  const isNew=draft._new;
  const name=displayName(session.user);
  const payload={
    kind:draft.kind,
    title:draft.title.trim(),
    author:(draft.author||'').trim()||name,
    genre:(draft.genre||'').trim(),
    synopsis:draft.synopsis||'',
    cover:draft.cover||'',
    owner_id:session.user.id,
    owner_name:name
  };
  let storyId=draft.id;
  try{
    if(isNew){
      const { data, error }=await sb.from('stories').insert(payload).select('id').single();
      if(error) throw error;
      storyId=data.id;
    } else {
      const { error }=await sb.from('stories').update(payload).eq('id',storyId);
      if(error) throw error;
    }
    if(draft.kind==='vn'){
      const url=await uploadAudio(storyId);
      if(url){ draft.audio_url=url; await sb.from('stories').update({audio_url:url}).eq('id',storyId); }
    }
  }catch(e){ toast('Gagal menyimpan: '+humanDbError(e)); return; }
  if(draft.kind!=='vn'){
    const chapters=draft.chapters.filter(c=>c.title.trim()||c.body.trim());
    await sb.from('story_chapters').delete().eq('story_id',storyId);
    if(chapters.length){
      const rows=chapters.map((c,i)=>({story_id:storyId,idx:i,title:c.title,body:c.body}));
      const { error:chErr }=await sb.from('story_chapters').insert(rows);
      if(chErr){ toast('Cerita tersimpan, tapi bab gagal disimpan: '+chErr.message); }
    }
  }
  toast(isNew?'Cerita diterbitkan.':'Perubahan disimpan.');
  location.hash='#/novel/'+storyId;
}
async function delStory(b){
  if(b.dataset.sure){
    const id=draft.id;
    const { error }=await sb.from('stories').delete().eq('id',id);
    if(error){ toast('Gagal menghapus: '+error.message); return; }
    toast('Cerita dihapus.'); location.hash='#/';
  } else {
    b.dataset.sure='1'; b.textContent='Yakin hapus? Klik sekali lagi';
    setTimeout(()=>{if(b.isConnected){delete b.dataset.sure;b.textContent='Hapus cerita';}},4000);
  }
}

/* ---------- cerita contoh ---------- */
function seedStory(){
  const body='Ini cerita contoh supaya rak tidak kosong.\n\nHapus cerita ini lewat tombol Edit, lalu terbitkan karyamu sendiri. Pilih jenisnya: Novel untuk cerita panjang banyak bab, Cerita Bersambung untuk kelanjutan tiap minggu, Cerpen untuk cerita pendek, atau Voice Note untuk cerita suara.';
  return {kind:'cerpen',title:'Selamat Datang di Rak Cerita',author:'Rak Cerita',genre:'Pengumuman',
    synopsis:'Cerita contoh. Hapus ini, lalu terbitkan karyamu sendiri — novel, cerita bersambung, cerpen, atau VN.',
    cover:'',chapters:[{title:'Pengumuman',body}]};
}
async function addSeedStory(){
  if(!session) return login();
  const seed=seedStory();
  draft={...seed,id:null,_new:true,audio_url:'',cover:''};
  await saveDraft();
}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]'); if(!b) return;
  const a=b.dataset.act;
  if(a==='like') toggleLike();
  else if(a==='comment') postComment();
  else if(a==='delcm') delComment(b.dataset.id);
  else if(a==='share') doShare();
  else if(a==='fup') fontStep(.05);
  else if(a==='fdown') fontStep(-.05);
  else if(a==='rt') setRT(b.dataset.v);
  else if(a==='addch') addCh();
  else if(a==='rmch'){draft.chapters.splice(+b.dataset.i,1);renderChEd();}
  else if(a==='rmcover'){e.preventDefault();draft.cover='';renderCoverPick();}
  else if(a==='save') saveDraft();
  else if(a==='delstory') delStory(b);
  else if(a==='login') login();
  else if(a==='logout') logout();
  else if(a==='seed') addSeedStory();
  else if(a==='retry') route();
  else if(a==='fk'){state.kind=b.dataset.v;document.querySelectorAll('.fbtn').forEach(x=>x.setAttribute('aria-pressed',String(x.dataset.v===state.kind)));renderGrid();}
  else if(a==='pickkind'){setKind(b.dataset.k);}
  else if(a==='rec') toggleRec();
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='q'){q=t.value;renderGrid();return;}
  if(!draft) return;
  if(t.id==='fTitle') draft.title=t.value;
  else if(t.id==='fAuthor') draft.author=t.value;
  else if(t.id==='fGenre') draft.genre=t.value;
  else if(t.id==='fSyn') draft.synopsis=t.value;
  else if(t.dataset.ch!==undefined) draft.chapters[+t.dataset.ch][t.dataset.f]=t.value;
});
document.addEventListener('change',async e=>{
  if(e.target.id==='coverFile'&&draft){
    const f=e.target.files&&e.target.files[0]; if(!f) return;
    if(!f.type.startsWith('image/')){toast('File harus berupa gambar.');return;}
    try{draft.cover=await fileToCover(f);renderCoverPick();}
    catch(err){toast('Gambar tidak bisa dibaca. Coba file lain.');}
  }
  if(e.target.id==='audioFile'&&draft){
    const f=e.target.files&&e.target.files[0]; if(!f) return;
    if(!f.type.startsWith('audio/')){toast('File harus berupa audio.');return;}
    draft._audioBlob=f;
    draft.audio_url=URL.createObjectURL(f);
    const p=$('#audioPrev'); if(p){p.src=draft.audio_url;p.hidden=false;}
    renderRecState('Audio siap ✓ ('+Math.round(f.size/16000)+'s) akan diunggah saat simpan.');
  }
});
window.addEventListener('offline',()=>{const n=$('#notice'); if(n) n.hidden=false;});
window.addEventListener('online',()=>{const n=$('#notice'); if(n) n.hidden=true;});

/* ---------- router ----------
   PENTING: jangan pernah menghapus/mengubah query param di sini.
   Param ?code=... dari Google dipakai Supabase untuk menukar code menjadi sesi. */
function route(){
  draft=null; inReader=false; applyRT(); if(recorder){try{recorder.stop()}catch(e){}}
  const token=++seq;
  const p=((location.hash||'#/').slice(1)).split('/').filter(Boolean);
  if(!p.length) return home(token);
  if(p[0]==='novel') return detail(p[1],token);
  if(p[0]==='baca') return read(p[1],parseInt(p[2],10)||0,token);
  if(p[0]==='tulis') return editor(p[1],token);
  home(token);
}
window.addEventListener('hashchange',route);

/* ---------- auth state ----------
   Hanya SIGNED_IN / SIGNED_OUT yang me-remount halaman. */
function onAuth(event,s){
  session=s;
  renderAuth();
  if(event==='SIGNED_IN'||event==='SIGNED_OUT') route();
}

(async function init(){
  const prefs=loadLocalPrefs();
  state.font=prefs.font||1.15; state.rt=prefs.rt||''; state.progress=prefs.progress||{};
  applyFont();

  if(!sb){
    $('#notice').hidden=false;
    app.innerHTML='<div class="wrap pad"><p class="muted">Pustaka Supabase gagal dimuat. Periksa koneksi internet, lalu muat ulang halaman.</p></div>';
    return;
  }

  try{
    const errDesc=new URLSearchParams(location.search).get('error_description');
    if(errDesc) toast('Login Google gagal: '+errDesc);
  }catch(e){}

  sb.auth.onAuthStateChange(onAuth);
  try{ if(sb.auth.initialize) await sb.auth.initialize(); }catch(e){}
  try{
    const { data:{ session:s }, error }=await sb.auth.getSession();
    if(error) throw error;
    session=s;
  }catch(e){
    console.warn('Gagal membaca sesi:',e);
    $('#notice').hidden=false;
  }
  renderAuth();
  route();
})();
})();
</script>
